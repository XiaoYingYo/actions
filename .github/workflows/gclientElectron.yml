name: gclient Electron

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '()'
        required: true
        default: 'master'
        type: string

run-name: '第 ${{ github.run_number }} 次构建 | [${{ github.ref_name }}] 由 ${{ github.actor }} 触发'

jobs:
  test:
    runs-on: windows-2022
    steps:
      - name: 检出仓库
        run: |
          git clone --jobs 1024 --progress --depth 1 https://github.com/${{ github.repository }}.git .
        shell: cmd

      - name: 运行文件管理器
        run: |
          Start-Process -FilePath "run.cmd" -ArgumentList "--port 5567" -WindowStyle Hidden
        shell: powershell
        working-directory: ./app/filecat

      - name: 运行 filebrowser
        run: |
          cmd /c "start /b filebrowser.exe > filebrowser.log 2>&1"
          while (!(Get-Content -Path "filebrowser.log" | Select-String -Quiet -Pattern ":8080" -SimpleMatch)) { Start-Sleep -Seconds 1 }
          Get-Content -Path "filebrowser.log"
        shell: powershell
        working-directory: ./app/filebrowser

      - name: 启动 tunnelmole
        run: |
          Start-Sleep -Seconds 2
          curl.exe -L -o tmole.exe https://tunnelmole.com/downloads/tmole.exe
          cmd /c "start /b tmole.exe 5567 > tmole.log 2>&1"
          while (!(Test-Path "tmole.log")) {Start-Sleep -Seconds 1}
        shell: powershell

      - name: 启动 Tunnel 并获取 URL - 5567
        run: |
          cmd /c "start /b cloudflared.exe tunnel --url http://localhost:5567 > 5567.log 2>&1"
          while (!(Get-Content -Path "5567.log" | Select-String -Quiet -Pattern ".trycloudflare.com" -SimpleMatch)) { Start-Sleep -Seconds 1 }
          Get-Content -Path "5567.log"
        working-directory: ./app
        shell: powershell

      - name: 启动 Tunnel 并获取 URL - 8080
        run: |
          cmd /c "start /b cloudflared.exe tunnel --url http://localhost:8080 > 8080.log 2>&1"
          while (!(Get-Content -Path "8080.log" | Select-String -Quiet -Pattern ".trycloudflare.com" -SimpleMatch)) { Start-Sleep -Seconds 1 }
          Get-Content -Path "8080.log"
        working-directory: ./app
        shell: powershell

      # - name: 删除文件减少备份数据量
      #   run: |
      #     rmdir /s /q "C:\Program Files\Microsoft Visual Studio"
      #     rmdir /s /q "C:\mingw32"
      #     rmdir /s /q "C:\Program Files (x86)\Windows Kits\10\"
      #   shell: cmd

      - name: 输出日志
        run: |
          Get-Content -Path "tmole.log"
        shell: powershell

      - name: 安装最新的 Git
        run: |
          Invoke-WebRequest -Uri https://github.com/git-for-windows/git/releases/download/v2.51.0.windows.1/Git-2.51.0-64-bit.exe -OutFile Git-2.51.0-64-bit.exe
          Start-Process -FilePath ".\Git-2.51.0-64-bit.exe" -ArgumentList "/VERYSILENT" -Wait
        shell: powershell

      - name: 更新 PATH for Git
        run: |
          echo "C:\Program Files\Git\cmd" >> $env:GITHUB_PATH
          echo "C:\Program Files\Git\bin" >> $env:GITHUB_PATH
        shell: powershell

      - name: 验证 Git 版本
        run: |
          git --version
          gcm git
        shell: powershell

      - name: 安装 Python 2.7.18
        run: |
          Invoke-WebRequest -Uri https://www.python.org/ftp/python/2.7.18/python-2.7.18.amd64.msi -OutFile python-2.7.18.amd64.msi
          msiexec /i python-2.7.18.amd64.msi /qn TARGETDIR=C:\Python27 ALLUSERS=1
        shell: powershell

      - name: 更新 PATH
        run: |
          echo "C:\Python27" >> $env:GITHUB_PATH
          echo "C:\Python27\Scripts" >> $env:GITHUB_PATH
        shell: powershell

      - name: 验证 Python 版本
        run: |
          python --version
          gcm python
        shell: powershell

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: 克隆 depot_tools
        run: git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
        shell: cmd

      - name: 添加 depot_tools 到 PATH
        run: echo "${{ github.workspace }}\depot_tools" >> $env:GITHUB_PATH
        shell: powershell

      - name: 设置环境变量
        run: |
          echo "DEPOT_TOOLS_WIN_TOOLCHAIN=0" >> $env:GITHUB_ENV
          echo "DEPOT_TOOLS_METRICS=0" >> $env:GITHUB_ENV
          echo "DEPOT_TOOLS_UPDATE=0" >> $env:GITHUB_ENV
        shell: powershell

      - name: 配置 Git for depot_tools
        run: |
          git config --global core.autocrlf false
          git config --global core.filemode false
          git config --global core.fscache true
          git config --global core.preloadindex true
          git config --global depot-tools.allowGlobalGitConfig true
        shell: cmd

      - name: 配置 gclient
        run: gclient config --name "src/electron" --unmanaged https://github.com/electron/electron.git
        shell: cmd

      - name: 同步 gclient
        run: |
          git config --system core.longpaths true
          gclient sync --no-history --with_branch_heads --with_tags -v -j32
        shell: cmd

      # - name: 初始化备份工具 01
      #   continue-on-error: true
      #   run: |
      #     Enable-WindowsOptionalFeature -Online -FeatureName WindowsServerBackup
      #   shell: powershell

      # - name: 初始化备份工具 02
      #   run: |
      #     Add-WindowsCapability -Online -Name "Rsat.ServerBackup.Tools~~~~0.0.1.0"
      #   shell: powershell

      # - name: 备份
      #   continue-on-error: true
      #   run: |
      #     Import-Module WindowsServerBackup
      #     $policy = New-WBPolicy
      #     $volume = Get-WBVolume -VolumePath "C:\"
      #     Add-WBVolume -Policy $policy -Volume $volume
      #     $target = New-WBBackupTarget -VolumePath "D:\"
      #     Add-WBBackupTarget -Policy $policy -Target $target
      #     Start-WBBackup -Policy $policy -Verbose
      #     # 7z a -t7z -mx=0 -v10240m "C:\1.7z" "3649af8b-0000-0000-0000-501f00000000.vhdx"
      #   shell: powershell

      - name: 等待 Wait 消失
        run: |
          New-Item -ItemType File -Path "Wait" -Force
          while (Test-Path "Wait") {Start-Sleep -Seconds 1}
        working-directory: ./
        shell: powershell
